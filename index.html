<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GHOST_DRIVE</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&family=JetBrains+Mono:wght@300&display=swap" rel="stylesheet">
</head>
<body>
    <div class="crt-overlay"></div>
    <audio id="bg-music" loop><source src="https://assets.mixkit.co/music/preview/mixkit-atmospheric-dream-40.mp3" type="audio/mpeg"></audio>
    <audio id="sfx-ping"><source src="https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3" type="audio/mpeg"></audio>

    <div id="boot-screen" onclick="startSystem()">
        <div class="boot-content">
            <h1 class="glitch-text">GHOST_DRIVE</h1>
            <p>&gt; ATTEMPTING_REMOTE_MOUNT... [OK]</p>
            <p>&gt; SOURCE: CLOUD_BACKUP</p>
            <p class="blink">&gt; [ TOUCH TO INITIALIZE ]</p>
        </div>
    </div>

    <div id="desktop" class="hidden">
        <div class="taskbar">
            <div class="sys-id">NODE_730 // RECOVERY_ACTIVE</div>
            <div class="clock" id="clock">--:--</div>
        </div>

        <div class="icon-grid" id="icon-grid"></div>

        <div id="window-overlay" class="window-overlay hidden">
            <div class="window-content">
                <div class="window-header">
                    <span id="window-title">APP</span>
                    <span class="close-btn" onclick="closeWindow()">×</span>
                </div>
                <div id="app-body" class="app-body"></div>
            </div>
        </div>

        <div id="notif" class="notif hidden">
            <div class="notif-header">SYSTEM ALERT</div>
            <p id="notif-msg"></p>
        </div>
    </div>

    <script src="case-sarah.js"></script>
    <script src="engine.js"></script>
</body>
</html>
