<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>The Glass House</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wallpaper"></div>
    <div class="crt-filter"></div>
    <audio id="bg-music" loop preload="auto"><source src="https://assets.mixkit.co/music/preview/mixkit-creepy-carnival-ambience-with-crows-cawing-2586.mp3" type="audio/mpeg"></audio>

    <div id="boot-screen" onclick="startSystem()">
        <div id="lock-banner" class="lock-banner"></div>
        <div class="boot-loader">
            <div class="boot-spinner"></div>
            <p id="boot-status">Restoring from iCloud...</p>
            <p class="blink-hint">Tap to Continue</p>
        </div>
    </div>

    <div id="os-shell" class="hidden">
        <div class="status-bar">
            <div class="carrier">Verizon</div>
            <div class="status-right">
                <span id="clock">12:00</span>
                <div class="battery-icon" id="battery-icon"><div id="battery-level"></div></div>
            </div>
        </div>

        <div id="home-screen" class="screen">
            <div class="app-grid" id="icon-grid"></div>
        </div>

        <div id="app-window" class="screen hidden">
            <header class="app-header">
                <button class="back-btn" onclick="goBack()">‹ Back</button>
                <h2 id="window-title">App</h2>
                <div class="header-spacer"></div>
            </header>
            <div id="app-body" class="app-content"></div>
        </div>
        <div id="notification-center"></div>
    </div>
    <script src="assets.js"></script>
    <script src="case-sarah.js"></script>
    <script src="engine.js"></script>
    <script>window.addEventListener('load', initLockScreen);</script>
</body>
</html>
